name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ALSA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src tests
      - name: Ruff
        run: ruff check src tests
      - name: Type check
        run: python -m mypy src
      - name: Pytest
        run: pytest
      - name: Wheel entrypoint outside the tree
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps -w /tmp/radiko-wheels .
          python -m pip install --target /tmp/radiko-prefix /tmp/radiko-wheels/*.whl -r requirements.txt
          cd /tmp
          /tmp/radiko-prefix/bin/radiko-client --help
          /tmp/radiko-prefix/bin/radiko-client inspect-chapters "$GITHUB_WORKSPACE/tests/fixtures/chapters.json" 90 0

  macos:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src tests
      - name: Ruff
        run: ruff check src tests
      - name: Type check
        run: python -m mypy src
      - name: Pytest
        run: pytest

  rust-cli-compare:
    name: Compare offline CLI with pinned Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install Rust 1.85.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.85.0 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build pinned source
        run: |
          git clone https://github.com/yanmakazuki/radiko-client.git /tmp/radiko-rust
          git -C /tmp/radiko-rust checkout --detach a7eaefa56729161e449a03ab2c0d2872429d8e87
          test "$(git -C /tmp/radiko-rust rev-parse HEAD)" = "a7eaefa56729161e449a03ab2c0d2872429d8e87"
          cargo build -p radiko-client --manifest-path /tmp/radiko-rust/Cargo.toml
      - name: Install this package
        run: python -m pip install -e ".[dev]"
      - name: Compare processes
        env:
          RADIKO_RUST_BIN: /tmp/radiko-rust/target/debug/radiko-client
        run: pytest tests/test_rust_cli_compare.py -q
