name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ALSA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src tests
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest
      - name: Wheel entrypoint outside the tree
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps -w /tmp/radiko-wheels .
          python -m pip install --target /tmp/radiko-prefix /tmp/radiko-wheels/*.whl -r requirements.txt
          cd /tmp
          /tmp/radiko-prefix/bin/radiko-client --help
          /tmp/radiko-prefix/bin/radiko-client inspect-chapters "$GITHUB_WORKSPACE/tests/fixtures/chapters.json" 90 0
